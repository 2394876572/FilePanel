# 构建期写入的信息，由 Maven 资源过滤生成。
#
# 存在的原因：JavaFX 的版本号在运行时镜像模式下拿不到——jlink 生成的运行时里
# JavaFX 是 jimage 里的模块，既没有 jar 文件名，module-info 与 MANIFEST 也不带版本号。
# 而"到底加载了哪个 JavaFX"是免装 Java 分发最需要证明的一件事，
# 所以在构建时把它固定下来，运行时读回来即可。
app.version=${project.version}
javafx.version=${javafx.version}
javafx.platform=${javafx.platform}
built.at=${maven.build.timestamp}
